name: build-windows-portable

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Windows x64 runtime packs
        run: dotnet restore VisualFolderExplorer.csproj -r win-x64 --configfile NuGet.Config -p:NuGetAudit=false

      - name: Publish self-contained portable folder
        run: >-
          dotnet publish VisualFolderExplorer.csproj -c Release -r win-x64 --self-contained true --no-restore
          -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -p:NuGetAudit=false
          -o publish/win-x64-portable

      - name: Create build manifest
        shell: pwsh
        run: |
          $exe = 'publish/win-x64-portable/VisualFolderExplorer.exe'
          if (-not (Test-Path $exe)) { throw "Portable EXE was not created: $exe" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "Visual Folder Explorer v1.0.4`nVisualFolderExplorer.exe SHA256: $hash" | Set-Content -Encoding UTF8 publish/win-x64-portable/BUILD_INFO.txt

      # Upload the published folder directly. GitHub Actions creates ONE artifact ZIP
      # automatically, so users only need to extract once. Do not wrap another ZIP
      # inside the artifact: Windows Explorer can behave badly with ZIP-inside-ZIP.
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: VisualFolderExplorer_v1.0.4_win-x64-portable
          path: publish/win-x64-portable/
          if-no-files-found: error
          compression-level: 0
