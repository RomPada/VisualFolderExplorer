name: build-windows-portable

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Windows x64 runtime packs
        run: dotnet restore VisualFolderExplorer.csproj -r win-x64 --configfile NuGet.Config -p:NuGetAudit=false

      - name: Publish self-contained portable folder
        run: >-
          dotnet publish VisualFolderExplorer.csproj -c Release -r win-x64 --self-contained true --no-restore
          -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -p:NuGetAudit=false
          -o publish/win-x64-portable

      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path publish/win-x64-portable/* -DestinationPath release/VisualFolderExplorer_v1.0.2_win-x64-portable.zip -Force

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: VisualFolderExplorer_v1.0.2_win-x64-portable
          path: release/VisualFolderExplorer_v1.0.2_win-x64-portable.zip
          if-no-files-found: error
